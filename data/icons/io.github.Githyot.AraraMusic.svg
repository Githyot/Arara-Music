<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#62a0ea"/>
      <stop offset="0.55" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#1c71d8"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a5fb4"/><stop offset="1" stop-color="#174b8f"/>
    </linearGradient>
    <linearGradient id="note" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e8f1fd"/>
    </linearGradient>
    <clipPath id="tile"><rect x="8" y="8" width="112" height="106" rx="24"/></clipPath>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
      <feOffset dy="2" result="b"/>
      <feFlood flood-color="#0b2d5c" flood-opacity="0.35"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- tile with GNOME-style bottom edge -->
  <rect x="8" y="12" width="112" height="108" rx="24" fill="url(#edge)"/>
  <rect x="8" y="8" width="112" height="106" rx="24" fill="url(#bg)"/>

  <!-- the ReelHouse macaw (same creator), front-facing, blurred behind the note -->
  <g clip-path="url(#tile)" filter="url(#blur)">
    <g transform="translate(70 60)">
      <!-- head feathers tuft -->
      <path d="M-14 -40 C-18 -56 -8 -62 -2 -52 C0 -62 12 -62 10 -48 C18 -54 26 -46 16 -36 Z" fill="#1c2f8f"/>
      <!-- head -->
      <ellipse cx="0" cy="0" rx="44" ry="42" fill="#2140b8"/>
      <ellipse cx="0" cy="58" rx="40" ry="26" fill="#1d379f"/>
      <!-- yellow eye rings + happy closed eyes -->
      <circle cx="-20" cy="-6" r="13" fill="#f6d32d"/>
      <circle cx="20" cy="-6" r="13" fill="#f6d32d"/>
      <path d="M-28 -4 Q-20 -14 -12 -4" stroke="#1b1b2b" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <path d="M12 -4 Q20 -14 28 -4" stroke="#1b1b2b" stroke-width="3.2" fill="none" stroke-linecap="round"/>
      <!-- cheeks -->
      <ellipse cx="-32" cy="14" rx="7" ry="4" fill="#f66151" opacity="0.7"/>
      <ellipse cx="32" cy="14" rx="7" ry="4" fill="#f66151" opacity="0.7"/>
      <!-- yellow beak base + dark hooked beak -->
      <path d="M-14 8 Q0 2 14 8 Q10 14 0 14 Q-10 14 -14 8 Z" fill="#f6d32d"/>
      <path d="M-13 10 C-12 2 12 2 13 10 C12 22 6 30 0 32 C-6 30 -12 22 -13 10 Z" fill="#3d3846"/>
      <!-- open mouth -->
      <path d="M-9 30 Q0 44 9 30 Z" fill="#a51d2d"/>
    </g>
  </g>
  <!-- light veil so the note reads clearly over the bird -->
  <rect x="8" y="8" width="112" height="106" rx="24" fill="#1c71d8" opacity="0.18"/>

  <!-- white eighth note: round head, stem, and a flag cut like a feather -->
  <g filter="url(#shadow)" fill="url(#note)" transform="translate(-8 0)">
    <ellipse cx="48" cy="86" rx="15" ry="11.5" transform="rotate(-22 48 86)"/>
    <rect x="58" y="30" width="7" height="56" rx="3.5"/>
    <path d="M58 30 h7 C66 40 74 46 82 52 C90 58 92 68 86 78 C88 68 82 60 65 56 V34 Z"/>
  </g>
</svg>
