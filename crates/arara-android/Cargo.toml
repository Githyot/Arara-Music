# Biblioteca do Arara Music para Android: o mesmo código do arara-app
# (links para ../arara-app), compilado como .so que o Qt carrega.
# Build: packaging/android/build.sh
[package]
name = "arara-android"
version.workspace = true
edition.workspace = true
license.workspace = true
# src/main.rs é a raiz da biblioteca aqui, não um binário.
autobins = false

[lib]
name = "arara_music"
path = "src/main.rs"
crate-type = ["cdylib"]

[dependencies]
arara-core = { path = "../arara-core" }
araracypher-core = { path = "../cypher-core" }
cxx = "1.0.176"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
serde_json = "1"
env_logger = "0.11"
log = "0.4"

[target.'cfg(unix)'.dependencies]
zbus = "4"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
directories = "5"

[build-dependencies]
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }
