# Flatpak manifest. Build with:
#   python3 flatpak-cargo-generator.py Cargo.lock -o build-aux/cargo-sources.json
#   flatpak-builder --user --install --force-clean build build-aux/io.github.Githyot.AraraMusic.yml
id: io.github.Githyot.AraraMusic
runtime: org.kde.Platform
runtime-version: '6.8'
sdk: org.kde.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: arara-music
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio
  - --share=network                      # LRCLIB lyrics
  - --filesystem=xdg-music:ro
  - --own-name=org.mpris.MediaPlayer2.arara.*
  - --talk-name=org.freedesktop.portal.Desktop
  - --env=QT_QUICK_CONTROLS_STYLE=Basic
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/arara-music/cargo
    QMAKE: /usr/bin/qmake6
modules:
  - name: arara-music
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml --verbose
      - cargo --offline build --release -p arara-app
      - install -Dm755 target/release/arara-music -t /app/bin/
      - install -Dm644 data/io.github.Githyot.AraraMusic.desktop -t /app/share/applications/
      - install -Dm644 data/io.github.Githyot.AraraMusic.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 data/icons/io.github.Githyot.AraraMusic.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: dir
        path: ..
      - cargo-sources.json
